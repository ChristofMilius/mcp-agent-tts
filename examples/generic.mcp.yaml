# Generic YAML form for harnesses that accept a mcpServers mapping.
# Replace the placeholder with the absolute checkout path.
mcpServers:
  mcp-agent-tts:
    type: stdio
    command: uv
    args:
      - run
      - --no-sync
      - --directory
      - "/absolute/path/to/mcp-agent-tts"
      - mcp-agent-tts
      - serve
    env:
      MCP_TTS_BACKEND: chatterbox
      MCP_TTS_MODEL: nano
